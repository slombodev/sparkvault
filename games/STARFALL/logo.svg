<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#3a2a8c"/><stop offset=".55" stop-color="#15174a"/><stop offset="1" stop-color="#05061a"/>
    </radialGradient>
    <radialGradient id="neb" cx="25%" cy="70%" r="45%">
      <stop offset="0" stop-color="#c77dff" stop-opacity=".55"/><stop offset="1" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a77bff"/><stop offset="1" stop-color="#3b2f7a"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa3b8"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa3b8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8ecf4"/><stop offset="1" stop-color="#8d96ad"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/><stop offset=".4" stop-color="#ffb03a"/><stop offset="1" stop-color="#ff4d2e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd34d" stop-opacity=".9"/><stop offset="1" stop-color="#ffd34d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a07a5e"/><stop offset="1" stop-color="#4a3326"/>
    </linearGradient>
    <clipPath id="r"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#neb)"/>
    <g fill="#fff">
      <circle cx="70" cy="90" r="3" opacity=".8"/><circle cx="430" cy="70" r="2.5" opacity=".7"/>
      <circle cx="460" cy="300" r="2" opacity=".6"/><circle cx="60" cy="330" r="2" opacity=".6"/>
      <circle cx="150" cy="200" r="1.8" opacity=".5"/><circle cx="380" cy="180" r="1.6" opacity=".5"/>
    </g>
    <!-- planeta -->
    <circle cx="410" cy="120" r="58" fill="url(#planet)"/>
    <ellipse cx="410" cy="120" rx="96" ry="20" fill="none" stroke="#e7c6ff" stroke-width="9" transform="rotate(-18 410 120)" opacity=".85"/>
    <!-- meteorito con estela -->
    <path d="M40 40 L150 150 L128 168 Z" fill="#ff7a3d" opacity=".55"/>
    <polygon points="132,140 160,128 182,146 178,176 150,186 128,168" fill="url(#rock)"/>
    <circle cx="150" cy="150" r="7" fill="#3a271c" opacity=".6"/>
    <!-- grilla del piso -->
    <g stroke="#8a5bff" stroke-opacity=".35" stroke-width="2">
      <path d="M0 430 H512 M0 460 H512 M0 495 H512"/>
      <path d="M256 400 L120 512 M256 400 L392 512 M256 400 L20 512 M256 400 L492 512 M256 400 V512"/>
    </g>
    <!-- estrella -->
    <circle cx="376" cy="250" r="70" fill="url(#glow)"/>
    <polygon points="376,198 391,236 432,238 400,263 411,302 376,280 341,302 352,263 320,238 361,236"
             fill="#ffd34d" stroke="#fff3b0" stroke-width="6" stroke-linejoin="round"/>
    <!-- nave -->
    <g transform="translate(236 330) rotate(-12)">
      <path d="M0 150 L-26 80 L26 80 Z" fill="#5ee6ff" opacity=".85"/>
      <path d="M0 -150 L26 -60 L150 50 L146 76 L40 62 L28 84 L-28 84 L-40 62 L-146 76 L-150 50 L-26 -60 Z" fill="#3a3f52" stroke="#5ee6ff" stroke-width="6" stroke-linejoin="round"/>
      <path d="M0 -112 L26 -4 L24 80 L-24 80 L-26 -4 Z" fill="#5a6078"/>
      <ellipse cx="0" cy="-40" rx="15" ry="36" fill="#5ee6ff"/>
      <ellipse cx="-5" cy="-52" rx="5" ry="14" fill="#e8fbff" opacity=".85"/>
      <circle cx="0" cy="84" r="16" fill="#bff6ff"/>
    </g>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="4"/>
</svg>
